    <style>

        /* Leaderboard */

        }
        
        .leaderboard h2 {
            font-family: 'bebas', sans-serif;

            margin-top: 0;

        }
        
        .leaderboard ol {
            padding-left: 20px;
			padding-right: 20px;
            font-size: 24px;

        }

</head>
<body>

                <div class='content'>
                    <a href='football.html' class='link'>Main</a>

    <div class="pong-container">
        <div class="game-area">
            <h1 id="titlepong">PONG</h1>
            <canvas id="pong" width="800" height="400"></canvas>
        </div>
        <div class="leaderboard">    
            <h2>LEADERBOARD</h2>
            <ol id="scores-list"></ol>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('pong');
        const context = canvas.getContext('2d');
        let ballY = 200;
        let ballX = 200;
        const ballRadius = 20;
        let ballVelocityX = Math.floor(Math.random() * (11 - 6) ) + 6; 
        let ballVelocityY = Math.floor(Math.random() * (11 - 6) ) + 6; 
        let aiY = 20;
        let plY = 20;
        let paHeight = 120;
        let paWidth = 25;
        let paSpeed = 8;
        let upPressed = false;
        let downPressed = false;
        let plScore = 0;
        let aiScore = 0;
        let botCollisions = 0;
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const LEADERBOARD_API_URL = "https://script.google.com/macros/s/AKfycbwN5TvCpiqB0vVYupvOd9BFlOqADAAsZgoxmvyhV1djl45jv5s8vKkD38raXsyp5Hqe/exec";
        let leaderboard = [];
        
        async function updateLeaderboard() {
            try {
                const response = await fetch(LEADERBOARD_API_URL);
                leaderboard = await response.json();
                
                const scoresList = document.getElementById('scores-list');
                scoresList.innerHTML = leaderboard
                    .map((entry, index) => `<li>${entry[0]}: ${entry[1]}</li>`)
                    .join('');
            } catch (error) {
                console.error("Error fetching leaderboard:", error);
            }
        }
        
        async function saveScore(name, score) {
            try {
                await fetch(LEADERBOARD_API_URL, {
                    method: "POST",
                    body: JSON.stringify({ name, score })
                });
                await updateLeaderboard();
            } catch (error) {
                console.error("Error saving score:", error);
            }
        }

        function draw() {
            context.clearRect(0, 0, canvas.width, canvas.height);

            context.fillStyle = "LightGray";
            context.font = "300px Header";
            context.fillText(aiScore,120,290);
            context.fillText(plScore,515,290);
            
            context.fillStyle = "black";
            
            context.fillRect(0,aiY,paWidth,paHeight);
            
            context.fillRect((800-paWidth),plY,paWidth,paHeight);
            
            context.beginPath();
            context.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
            context.fill();
        }

        // Event listeners for key presses
        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowUp') {
                upPressed = true;
            } else if (event.key === 'ArrowDown') {
                downPressed = true;
            }
        });

        document.addEventListener('keyup', function(event) {
            if (event.key === 'ArrowUp') {
                upPressed = false;
            } else if (event.key === 'ArrowDown') {
                downPressed = false;
            }
        });

        async function handleGameEnd() {
            const name = prompt(plScore == 10 ? "You Win! Enter your name for the leaderboard:" : "Game Over! Enter your name for the leaderboard:");
            if (name) {
                await saveScore(name, plScore);
            }
            plScore = 0;
            aiScore = 0;
        }
        
        function update() {
            //Ball Movement
            ballX = ballX + ballVelocityX;
            ballY = ballY + ballVelocityY;

            //Floor/Ceiling-Ball Collisions
            if ((ballY - ballRadius) < 0) {
                ballVelocityY = -ballVelocityY;
                ballY = 0 + ballRadius;
                waContact();
            } else if ((ballY + ballRadius) > 400) {
                ballVelocityY = -ballVelocityY;
                ballY = 400 - ballRadius;
                waContact();
            }

            //Bot Paddle Movement
            if (((ballY) > (aiY+(paHeight/2))) && ((aiY + paHeight) < 400) && (ballX < 400) && (ballVelocityX<0)) {
                aiY = aiY + paSpeed;
            } else if (((ballY) < (aiY+(paHeight/2))) && (aiY > 0) && (ballX < 400) && (ballVelocityX<0)) {
                aiY = aiY - paSpeed;
            }

            //Ball-Paddle Collisions
            if (((ballX-ballRadius)<(0+paWidth)) && (ballY>(aiY-10)) && (ballY<(aiY+paHeight+10))) {
                ballVelocityX = -ballVelocityX;
                ballVelocityX = ballVelocityX + 1;
                botCollisions = botCollisions + 1;
                paContact();
            } else if (((ballX+ballRadius)>(800-paWidth)) && (ballY>(plY-10)) && (ballY<(plY+paHeight+10))) {
                ballVelocityX = -ballVelocityX;
                ballVelocityX = ballVelocityX - 1;
                paContact();
            }

            //Player Paddle Movement
            if (upPressed && plY > 0) {
                plY -= paSpeed;
            }
            if (downPressed && plY < canvas.height - paHeight) {
                plY += paSpeed;
            }

            //Ball Reset
            if ((ballX-ballRadius)<(-30)) {
                plScore = plScore + 1;
                playerScores();
                ballVelocityX = Math.floor(Math.random() * (12 - 6) ) + 6; 
                ballVelocityY = Math.floor(Math.random() * (10 - 5) ) + 5; 
                ballX = 400;
                ballY = 200;
                plGoal();
                console.log(botCollisions + "   WIN")
                botCollisions = 0;
                if (plScore == 10) {
                    console.log(("\n\nYOU WIN!\n\nFINAL SCORE: " + aiScore + ":" + plScore))
                    handleGameEnd();
                }
            }
            if ((ballX+ballRadius)>(830)) {
                aiScore = aiScore + 1;
                botScores();
                ballVelocityX = -(Math.floor(Math.random() * (12 - 6) ) + 6); 
                ballVelocityY = Math.floor(Math.random() * (10 - 5) ) + 5; 
                ballX = 400;
                ballY = 200;
                aiGoal();
                console.log(botCollisions  + "   LOSS")
                botCollisions = 0;
                if (aiScore == 10) {
                    console.log(("\n\nYOU LOSE!\n\nFINAL SCORE: " + aiScore + ":" + plScore))
                    handleGameEnd();
                }
            }
        }

        function playerScores() {
            document.body.style.backgroundColor = 'green';
            setTimeout(() => {
                document.body.style.backgroundColor = 'rgb(119, 73, 148)';
            }, 1000);
        }

        function botScores() {
            document.body.style.backgroundColor = 'red';
            setTimeout(() => {
                document.body.style.backgroundColor = 'rgb(119, 73, 148)';
            }, 1000);
        }
        
        function playSound(frequency, duration) {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            const oscillator = audioContext.createOscillator();
            oscillator.type = 'sine'; // Type of sound wave
            oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
            oscillator.connect(audioContext.destination);
            oscillator.start();
            oscillator.stop(audioContext.currentTime + duration);
        }

        function paContact() {
            playSound(550, 0.1); // Play for 0.1 seconds
        }

        function waContact() {
            playSound(800, 0.03); // Play for 0.03 seconds
        }

        function plGoal() {
            playSound(350, 1); // Play for 1 second
        }

        function aiGoal() {
            playSound(200, 1); // Play for 1 second
        }
        
        function gameLoop() {
            draw();
            update();
            requestAnimationFrame(gameLoop);
        }

        // Start the game
        updateLeaderboard();
        gameLoop();
    </script>
</body>
